name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Newsletter and theme checks
        run: |
          php tests/theme-design-static.php
          php tests/comment-webhook-delivery.php
          php tests/newsletter-weekly.php
